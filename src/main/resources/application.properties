spring.application.name=course-project
server.port=8080

# ---------- H2 Database ----------
spring.datasource.url=jdbc:h2:file:./db/courseproject
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Каталог фильмов
info.app.description=Курсовой проект на Spring Boot: фильмы, актёры, роли
info.app.version=1.0.0
info.developer.name=Архипов
info.developer.university=УрФУ, РТФ

# ---------- Errors ----------
server.error.include-message=always
server.error.include-stacktrace=never
