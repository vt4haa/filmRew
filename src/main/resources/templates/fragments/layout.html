<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Каталог фильмов'">Каталог фильмов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background:#111827;">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <span style="color:#fb7185;">●</span> Каталог фильмов
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
                aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/movies}">Фильмы</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/actors}">Актёры</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/calculator}">Расчёт прибыли</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">О приложении</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/users}">Пользователи</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/actuator}" target="_blank" rel="noopener">Actuator</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <div sec:authorize="isAuthenticated()" class="text-white-50 small text-end">
                    <div th:if="${currentUser != null}" class="text-white fw-semibold"
                         th:text="${currentUser.fullName}">Пользователь</div>
                    <div th:if="${currentUser != null}" th:text="${currentUser.role.title}">Роль</div>
                </div>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Вход</a>
                    <a class="btn btn-accent btn-sm" th:href="@{/register}">Регистрация</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="footer py-3 mt-4">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span>Курсовой проект · Spring Boot · H2 · Thymeleaf</span>
        <span>УрФУ, 2026</span>
    </div>
</footer>

</body>
</html>
