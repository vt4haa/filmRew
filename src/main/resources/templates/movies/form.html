<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Форма фильма')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h1 class="h3 mb-1" th:text="${movie.id == null} ? 'Новый фильм' : 'Редактирование фильма'">
                        Фильм
                    </h1>
                    <p class="text-muted mb-0">Заполните карточку фильма и его характеристики</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/movies}">К списку</a>
            </div>

            <form th:action="@{/movies/save}" th:object="${movie}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="card mb-3">
                    <div class="card-header">Основные сведения</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="title" class="form-label">Название</label>
                                <input type="text" id="title" class="form-control" th:field="*{title}"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{title}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="genre" class="form-label">Жанр</label>
                                <input type="text" id="genre" class="form-control" th:field="*{genre}"
                                       th:classappend="${#fields.hasErrors('genre')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{genre}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="releaseYear" class="form-label">Год выпуска</label>
                                <input type="number" id="releaseYear" class="form-control" th:field="*{releaseYear}"
                                       th:classappend="${#fields.hasErrors('releaseYear')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{releaseYear}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="budget" class="form-label">Бюджет, ₽</label>
                                <input type="number" step="0.01" min="0" id="budget" class="form-control"
                                       th:field="*{budget}"
                                       th:classappend="${#fields.hasErrors('budget')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{budget}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="boxOffice" class="form-label">Кассовые сборы, ₽</label>
                                <input type="number" step="0.01" min="0" id="boxOffice" class="form-control"
                                       th:field="*{boxOffice}"
                                       th:classappend="${#fields.hasErrors('boxOffice')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{boxOffice}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-header">Характеристики фильма (таблица MovieDetails)</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="durationMinutes" class="form-label">Длительность, мин</label>
                                <input type="number" min="1" max="600" id="durationMinutes" class="form-control"
                                       th:field="*{durationMinutes}"
                                       th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{durationMinutes}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="rating" class="form-label">Рейтинг (0–10)</label>
                                <input type="number" step="0.1" min="0" max="10" id="rating" class="form-control"
                                       th:field="*{rating}"
                                       th:classappend="${#fields.hasErrors('rating')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{rating}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="studio" class="form-label">Студия</label>
                                <input type="text" id="studio" class="form-control" th:field="*{studio}"
                                       th:classappend="${#fields.hasErrors('studio')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{studio}"></div>
                            </div>
                            <div class="col-12">
                                <label for="synopsis" class="form-label">Описание</label>
                                <textarea id="synopsis" rows="4" class="form-control" th:field="*{synopsis}"
                                          th:classappend="${#fields.hasErrors('synopsis')} ? 'is-invalid'"></textarea>
                                <div class="invalid-feedback" th:errors="*{synopsis}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent">Сохранить</button>
                    <a class="btn btn-outline-secondary" th:href="@{/movies}">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
