<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Актёры')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1">Актёры</h1>
            <p class="text-muted mb-0">Вторая таблица каталога — Actors</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/movies}">Фильмы</a>
            <a sec:authorize="hasAnyRole('USER','ADMIN')" class="btn btn-accent" th:href="@{/actors/new}">
                + Добавить актёра
            </a>
        </div>
    </div>

    <div class="alert alert-warning" sec:authorize="hasRole('READ_ONLY')">
        Роль «Только чтение»: изменение списка актёров недоступно.
    </div>
    <div class="alert alert-info" sec:authorize="hasRole('USER')">
        Вам отображаются актёры, относящиеся к созданным вами фильмам.
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Актёр</th>
                        <th>Страна</th>
                        <th>Гонорар, ₽</th>
                        <th>Фильм</th>
                        <th>Владелец</th>
                        <th class="text-end">Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="actor, stat : ${actors}">
                        <td th:text="${stat.count}">1</td>
                        <td class="fw-semibold" th:text="${actor.fullName}">Имя</td>
                        <td th:text="${actor.country}">Страна</td>
                        <td th:text="${#numbers.formatDecimal(actor.fee, 1, 'WHITESPACE', 2, 'COMMA')}">0</td>
                        <td>
                            <a th:href="@{/movies/{id}(id=${actor.movie.id})}" th:text="${actor.movie.title}">Фильм</a>
                        </td>
                        <td th:text="${actor.owner.username}">user</td>
                        <td class="text-end text-nowrap">
                            <a sec:authorize="hasAnyRole('USER','ADMIN')" class="btn btn-sm btn-outline-primary"
                               th:href="@{/actors/{id}/edit(id=${actor.id})}">Изменить</a>
                            <form sec:authorize="hasAnyRole('USER','ADMIN')" class="d-inline"
                                  th:action="@{/actors/{id}/delete(id=${actor.id})}" method="post"
                                  onsubmit="return confirm('Удалить запись об актёре?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(actors)}">
                        <td colspan="7" class="text-center text-muted py-4">Актёры не найдены</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
