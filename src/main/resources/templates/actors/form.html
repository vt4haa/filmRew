<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Форма актёра')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h1 class="h3 mb-1" th:text="${actor.id == null} ? 'Новый актёр' : 'Редактирование актёра'">
                        Актёр
                    </h1>
                    <p class="text-muted mb-0">Свяжите актёра с фильмом каталога</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/actors}">К списку</a>
            </div>

            <form th:action="@{/actors/save}" th:object="${actor}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="card">
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Имя и фамилия</label>
                            <input type="text" id="fullName" class="form-control" th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="country" class="form-label">Страна</label>
                                <input type="text" id="country" class="form-control" th:field="*{country}"
                                       th:classappend="${#fields.hasErrors('country')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{country}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="fee" class="form-label">Гонорар, ₽</label>
                                <input type="number" step="0.01" min="0" id="fee" class="form-control"
                                       th:field="*{fee}"
                                       th:classappend="${#fields.hasErrors('fee')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{fee}"></div>
                            </div>
                            <div class="col-12">
                                <label for="movieId" class="form-label">Фильм</label>
                                <select id="movieId" class="form-select" th:field="*{movieId}"
                                        th:classappend="${#fields.hasErrors('movieId')} ? 'is-invalid'">
                                    <option value="">— выберите фильм —</option>
                                    <option th:each="movie : ${movies}" th:value="${movie.id}"
                                            th:text="${movie.title + ' (' + movie.releaseYear + ')'}">Фильм</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{movieId}"></div>
                                <div class="form-text" th:if="${#lists.isEmpty(movies)}">
                                    Сначала создайте хотя бы один фильм.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-accent">Сохранить</button>
                    <a class="btn btn-outline-secondary" th:href="@{/actors}">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
